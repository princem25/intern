<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - InternAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</head>

<body>

    <div class="flex min-h-screen bg-body">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header"
                style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; border-bottom: 1px solid var(--border);">
                <div style="display: flex; align-items: center;">
                    <i class="fa-solid fa-layer-group text-primary"
                        style="font-size: 1.5rem; margin-right: 0.75rem;"></i>
                    <span style="font-size: 1.25rem; font-weight: 700;">InternAI</span>
                </div>
                <button id="sidebar-collapse-btn"
                    style="background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>

            <nav class="sidebar-menu" style="padding: 1.5rem 1rem; flex: 1;">
                <a href="intern-dashboard.html" class="menu-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a href="intern-workspace.html" class="menu-item">
                    <i class="fa-solid fa-list-check"></i>
                    <span>My Tasks</span>
                </a>
                <a href="intern-performance.html" class="menu-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Performance</span>
                </a>
                <a href="intern-session-history.html" class="menu-item">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Session History</span>
                </a>
                <a href="intern-profile.html" class="menu-item active">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <div style="padding: 1rem; border-top: 1px solid var(--border);">
                <a href="login.html" class="menu-item" style="color: var(--danger);">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="main-content"
            style="flex: 1; margin-left: 240px; display: flex; flex-direction: column; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);">

            <!-- Topbar -->
            <header class="topbar">
                <div class="flex items-center gap-4">
                    <button id="sidebar-expand-btn" class="btn btn-secondary" style="padding: 0.5rem; display: none;">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h2 style="font-size: 1.25rem; margin: 0;">My Profile</h2>
                </div>
                <div class="flex items-center gap-4">
                    <button class="btn btn-secondary"
                        style="border: none; background: transparent; font-size: 1.25rem; color: var(--text-muted);">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div class="flex items-center gap-2 cursor-pointer">
                        <div
                            style="width: 32px; height: 32px; background: var(--gradient-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600;">
                            JD</div>
                        <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; color: var(--text-muted);"></i>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="p-8">
                <div class="grid grid-cols-3 gap-8">
                    <!-- Profile Card -->
                    <div class="card p-6" style="text-align: center;">
                        <div
                            style="width: 100px; height: 100px; background: var(--gradient-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 2.5rem; margin: 0 auto 1.5rem;">
                            JD
                        </div>
                        <h3 class="mb-2">John Doe</h3>
                        <p class="text-muted mb-4">Frontend Intern</p>
                        <div class="badge badge-success mb-6">Active</div>

                        <div style="text-align: left; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                            <div class="mb-4">
                                <label class="input-label" style="color: var(--text-muted);">Email</label>
                                <div class="font-medium">john.doe@example.com</div>
                            </div>
                            <div class="mb-4">
                                <label class="input-label" style="color: var(--text-muted);">Phone</label>
                                <div class="font-medium">+1 (555) 123-4567</div>
                            </div>
                            <div class="mb-4">
                                <label class="input-label" style="color: var(--text-muted);">Location</label>
                                <div class="font-medium">New York, USA</div>
                            </div>
                            <div>
                                <label class="input-label" style="color: var(--text-muted);">Joined</label>
                                <div class="font-medium">Oct 10, 2026</div>
                            </div>
                        </div>
                    </div>

                    <!-- Edit Details Form -->
                    <div class="col-span-2">
                        <div class="card p-6 mb-8">
                            <h3 class="mb-6">Edit Profile</h3>
                            <form>
                                <div class="grid grid-cols-2 gap-6 mb-4">
                                    <div>
                                        <label class="input-label">First Name</label>
                                        <input type="text" class="input-field" value="John">
                                    </div>
                                    <div>
                                        <label class="input-label">Last Name</label>
                                        <input type="text" class="input-field" value="Doe">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-6 mb-6">
                                    <div>
                                        <label class="input-label">Email</label>
                                        <input type="email" class="input-field" value="john.doe@example.com">
                                    </div>
                                    <div>
                                        <label class="input-label">Phone</label>
                                        <input type="tel" class="input-field" value="+1 (555) 123-4567">
                                    </div>
                                </div>
                                <div class="flex justify-between items-center">
                                    <button type="button" class="btn btn-secondary">Cancel</button>
                                    <button type="button" class="btn btn-primary">Save Changes</button>
                                </div>
                            </form>
                        </div>

                        <div class="card p-6">
                            <h3 class="mb-6">Security</h3>
                            <form>
                                <div class="mb-4">
                                    <label class="input-label">Current Password</label>
                                    <input type="password" class="input-field" placeholder="Enter current password">
                                </div>
                                <div class="grid grid-cols-2 gap-6 mb-6">
                                    <div>
                                        <label class="input-label">New Password</label>
                                        <input type="password" class="input-field" placeholder="Enter new password">
                                    </div>
                                    <div>
                                        <label class="input-label">Confirm New Password</label>
                                        <input type="password" class="input-field" placeholder="Confirm new password">
                                    </div>
                                </div>
                                <div class="flex justify-between items-center">
                                    <div></div>
                                    <button type="button" class="btn btn-secondary">Update Password</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
