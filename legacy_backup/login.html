<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Internship System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    </script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-body);
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-header {
            margin-bottom: 2rem;
        }

        .auth-logo {
            /* New class for logo styles */
            font-size: 2rem;
            margin-bottom: 1rem;
            display: block;
        }

        .auth-heading-mb {
            /* New class for h3 margin */
            margin-bottom: 0.5rem;
        }

        .input-group.text-start {
            /* Combined with existing class */
            text-align: left;
        }

        .remember-me-group {
            /* New class for flex container */
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .remember-me-label {
            /* New class for label */
            cursor: pointer;
            color: var(--text-muted);
        }

        .remember-me-checkbox {
            /* New class for checkbox */
            accent-color: var(--primary);
        }

        .btn-full-width-padding {
            /* New class for button styles */
            padding: 0.875rem;
            font-size: 1rem;
        }

        .register-text-group {
            /* New class for register text */
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }

        .quick-access-section {
            /* New class for quick access section */
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .quick-access-text {
            /* New class for quick access paragraph */
            font-size: 0.75rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo auth-logo">InternAI</a>
                <h3 class="auth-heading-mb">Welcome Back</h3>
                <p class="text-muted">Sign in to your dashboard</p>
            </div>

            <form action="intern-dashboard.html" method="GET">
                <div class="input-group text-start" style="text-align: left;">
                    <label class="input-label">Email Address</label>
                    <input type="email" class="input-field" placeholder="you@example.com" required>
                </div>

                <div class="input-group text-start" style="text-align: left;">
                    <label class="input-label">Password</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>

                <div class="flex justify-between items-center" style="margin-bottom: 1.5rem; font-size: 0.875rem;">
                    <label class="flex items-center gap-2" style="cursor: pointer; color: var(--text-muted);">
                        <input type="checkbox" style="accent-color: var(--primary);">
                        Remember me
                    </label>
                    <a href="#" class="text-primary font-medium hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="padding: 0.875rem; font-size: 1rem;">Sign
                    In</button>
            </form>

            <div style="margin-top: 1.5rem; font-size: 0.875rem;">
                <span class="text-muted">Don't have an account? </span>
                <a href="register.html" class="text-primary font-medium hover:underline">Register</a>
            </div>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                <p class="text-muted" style="font-size: 0.75rem; margin-bottom: 0.75rem;">Quick Access (Demo)</p>
                <div class="flex justify-center gap-2">
                    <a href="intern-dashboard.html" class="badge badge-success">Intern</a>
                    <a href="lead-dashboard.html" class="badge badge-warning">Team Lead</a>
                    <a href="hr-dashboard.html" class="badge badge-danger">HR</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
